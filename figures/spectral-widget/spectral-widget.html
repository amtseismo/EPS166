<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True color, false color and NDVI</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#21312c;background:white}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}h1{font-size:20px;margin:0;margin-right:auto}select,button{font:inherit;padding:8px 12px;border:1px solid #b7c7c0;border-radius:6px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#216b50;color:white;border-color:#216b50}.layers{display:flex;gap:6px;flex-wrap:wrap}.frame{position:relative;height:clamp(230px,62vh,470px);background:#eef2ef;overflow:hidden;border:1px solid #c6d0ca;border-radius:8px}#tiles{position:absolute;inset:0}#tiles img{position:absolute;width:256px;height:256px;max-width:none}#snapshot{width:100%;height:100%;object-fit:contain;display:none}.notice{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#eef2ef}footer{font-size:12px;color:#53655a;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}footer a{color:inherit}#status{font-size:13px;margin:8px 0;min-height:18px}.controls{display:flex;gap:6px;align-items:center}#save{font-size:13px}body.offline #save{display:none}
</style></head><body><main>
<header><h1></h1><select id="sensor" aria-label="Satellite sensor"></select></header>
<header><div class="layers" role="group" aria-label="Image rendering"><button data-layer="Truecolor" aria-pressed="true">True Color</button><button data-layer="Falsecolor" aria-pressed="false">False Color</button><button data-layer="Ndvi" aria-pressed="false">NDVI</button></div></header>
<div class="frame"><div id="tiles"></div><img id="snapshot" alt="Satellite imagery of rural Uganda"><div id="notice" class="notice" hidden></div></div>
<p id="status" aria-live="polite"></p><button id="save">Save offline copy of all views</button>
<footer><span>Original imagery and configuration: <a href="https://landscape.satsummit.io/analysis/band-combinations.html" target="_blank" rel="noopener">SatSummit / Development Seed</a> · Mapbox</span><span id="mode">Online imagery · rural Uganda</span></footer>
</main><script id="offline-data" type="application/json">null</script><script>
const config={"token": "pk.eyJ1IjoiYnJ1bm9zYW4iLCJhIjoiY2lxeHg5N2p4MDFyYmZrbWdybWw2eDR6ciJ9.dzFsJgTLWzEeVb8rvhsONw", "maps": [{"id": "ugandaResAirbus6", "ugandaResTruecolor": "stateofsatellite.n9behe7a", "ugandaResFalsecolor": "stateofsatellite.n9bf6j5l", "ugandaResNdvi": "stateofsatellite.n9bepjed", "displayAttrib1": "SPOT 6, Mar 2015", "displayAttrib2": "1.5m", "zoom": 17, "accessToken": "pk.eyJ1IjoiYnJ1bm9zYW4iLCJhIjoiY2lxeHg5N2p4MDFyYmZrbWdybWw2eDR6ciJ9.dzFsJgTLWzEeVb8rvhsONw"}, {"id": "ugandaResAirbus5", "ugandaResTruecolor": "stateofsatellite.na0hk86f", "ugandaResFalsecolor": "stateofsatellite.n9be8l9l", "ugandaResNdvi": "stateofsatellite.n9bee6n6", "displayAttrib1": "SPOT 5, Dec 2007", "displayAttrib2": "2.5m", "zoom": 17, "accessToken": "pk.eyJ1IjoiYnJ1bm9zYW4iLCJhIjoiY2lxeHg5N2p4MDFyYmZrbWdybWw2eDR6ciJ9.dzFsJgTLWzEeVb8rvhsONw"}, {"id": "ugandaResBlackbridge", "ugandaResTruecolor": "stateofsatellite.n9bdifj5", "ugandaResFalsecolor": "stateofsatellite.n9be41l7", "ugandaResNdvi": "stateofsatellite.n9be0afe", "displayAttrib1": "RapidEye, Jan 2012", "displayAttrib2": "5m", "zoom": 17, "accessToken": "pk.eyJ1IjoiYnJ1bm9zYW4iLCJhIjoiY2lxeHg5N2p4MDFyYmZrbWdybWw2eDR6ciJ9.dzFsJgTLWzEeVb8rvhsONw"}]};
const stored=JSON.parse(document.getElementById('offline-data').textContent);
const sensor=document.getElementById('sensor'),tiles=document.getElementById('tiles'),notice=document.getElementById('notice'),status=document.getElementById('status'),snapshot=document.getElementById('snapshot');
let selected=0,layer='Truecolor',generation=0;
config.maps.forEach((m,i)=>sensor.add(new Option(m.displayAttrib1+' ('+m.displayAttrib2+')',String(i))));
function unavailable(i,l){return i===1&&l==='Truecolor'}
function tileSpecs(i,w,h){const z=17,n=2**z,lat=.5037,lon=33.2964;const cx=(lon+180)/360*n*256,cy=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n*256;const left=cx-w/2,top=cy-h/2,id=config.maps[i]['ugandaRes'+layer];let out=[];for(let y=Math.floor(top/256);y<=Math.floor((top+h-1)/256);y++)for(let x=Math.floor(left/256);x<=Math.floor((left+w-1)/256);x++)out.push({x:x*256-left,y:y*256-top,url:'https://api.mapbox.com/v4/'+id+'/'+z+'/'+x+'/'+y+'.png?access_token='+config.token});return out}
function message(text){notice.textContent=text;notice.hidden=false}
function render(){const run=++generation;tiles.replaceChildren();snapshot.style.display='none';notice.hidden=true;document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layer===layer)));if(unavailable(selected,layer)){message('SPOT-5 does not capture the visible-blue band, so a true-color composite is unavailable. Choose False Color or NDVI.');status.textContent='';return}if(stored){snapshot.src=stored[selected+'-'+layer];snapshot.style.display='block';status.textContent='Offline snapshot · same geographic extent in every view';return}status.textContent='Loading imagery…';const specs=tileSpecs(selected,tiles.clientWidth,tiles.clientHeight);let done=0,failed=0;for(const t of specs){const img=new Image;img.alt='';img.draggable=false;img.style.left=t.x+'px';img.style.top=t.y+'px';img.onload=()=>finish(false);img.onerror=()=>finish(true);img.src=t.url;tiles.append(img)}function finish(error){if(run!==generation)return;done++;if(error)failed++;if(done===specs.length){if(failed){message('Some imagery could not load. Check your internet connection. The original Mapbox imagery or access token may no longer be available.');status.textContent=failed+' image tiles failed to load.'}else status.textContent='Same geographic extent · '+config.maps[selected].displayAttrib1}}}
sensor.addEventListener('change',()=>{selected=Number(sensor.value);render()});document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{layer=b.dataset.layer;render()}));let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,100)});
if(stored){document.body.classList.add('offline');document.getElementById('mode').textContent='Offline imagery · rural Uganda'}
document.getElementById('save').addEventListener('click',async()=>{const button=document.getElementById('save');button.disabled=true;const oldLayer=layer;try{const w=tiles.clientWidth,h=tiles.clientHeight,saved={};for(let i=0;i<3;i++)for(const l of ['Truecolor','Falsecolor','Ndvi']){if(unavailable(i,l))continue;layer=l;status.textContent='Saving '+config.maps[i].displayAttrib1+' / '+l+'…';const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');for(const t of tileSpecs(i,w,h)){const response=await fetch(t.url);if(!response.ok)throw new Error('Image service returned '+response.status);const bitmap=await createImageBitmap(await response.blob());ctx.drawImage(bitmap,t.x,t.y,256,256);bitmap.close()}saved[i+'-'+l]=canvas.toDataURL('image/png')}const copy=document.documentElement.cloneNode(true);copy.querySelector('#offline-data').textContent=JSON.stringify(saved);copy.querySelector('#tiles').replaceChildren();copy.querySelector('#snapshot').removeAttribute('src');copy.querySelector('#save').disabled=false;const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='spectral-widget-offline.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);layer=oldLayer;render();status.textContent='Saved offline HTML with all eight available views.'}catch(e){layer=oldLayer;render();status.textContent='Could not save offline imagery: '+e.message+'. Use the online version or obtain the source images.'}finally{button.disabled=false}});
render();
</script></body></html>
